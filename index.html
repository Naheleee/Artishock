<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @font-face {
      font-family: "Ronzino-bold";
      src: local("Ronzino"), local("Ronzino-bold"), url(../Artishock/Ronzino_Font/Ronzino-Bold.otf) format("otf");
    }

    @font-face {
      font-family: "Ronzino-medium";
      src: local("Ronzino"), local("Ronzino-medium"), url(../Artishock/Ronzino_Font/Ronzino-Medium.otf) format("otf");
    }

    @font-face {
      font-family: "Ronzino-regular";
      src: local("Ronzino"), local("Ronzino-regular"), url(../Artishock/Ronzino_Font/Ronzino-Regular.otf) format("otf");
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 1rem;
      overflow: hidden;
      overscroll-behavior: none;
      place-items: stretch;
      background: black;
      color: #666;
    }

    main {
      width: 100%;
      height: 100%;
      text-align: center;
    }

    #game {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
    }

    svg {
      display: block;
      width: min(94vw, 1400px);
      height: auto;
      max-height: 70vh;
      max-height: 70dvh;
      filter: invert(1);
    }

    .connection {
      stroke: black;
      stroke-width: 4;
      stroke-linecap: round;
      pointer-events: none;
      animation: draw-line var(--draw-duration) linear both, fade-in 1000ms ease-out both;
    }

    .shape {
      fill: transparent;
      transition: fill 2s cubic-bezier(0.65, 0, 0.35, 1);
      pointer-events: none;
    }

    .shapes-filled .shape {
      fill: black;
    }

    @keyframes draw-line {
      from {
        stroke-dashoffset: var(--draw-distance);
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .connection {
        animation-duration: 0s;
        animation-delay: 0s !important;
      }

      .shape {
        transition-duration: 0s;
      }
    }

    .title {
      font-family: "Ronzino-bold", sans-serif;
      position: absolute;
      left: 0;
      width: 100%;
      top: 1%;
      text-align: center;
      font-size: 30px;
    }

    .credits {
      font-family: "Ronzino-regular", sans-serif;
      position: absolute;
      left: 0;
      width: 100%;
      bottom: 1%;
      text-align: center;
      font-size: 15px;
      line-height: 1.2;
    }

    .instruction {
      font-family: "Ronzino-regular", sans-serif;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      isolation: isolate;
      margin: 0;
      padding: 2rem 1.2rem;
      background: black;
      color: white;
      font-size: 16px;
      white-space: nowrap;
      pointer-events: auto;
      transition: opacity 1000ms;
    }

    @media (hover: hover) and (pointer: fine) {
      .instruction {
        cursor: pointer;
      }
    }

    .instruction::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -50% -50%;
      background: radial-gradient(ellipse at center, #000 0%, #000 30%, transparent 100%);
      pointer-events: none;
    }

    @media (min-width: 768px) {
      .instruction::before {
        inset: clamp(-14rem, -12vh, -7rem) clamp(-28rem, -24vw, -12rem);
      }
    }

    .instruction::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border: 1px solid #fff;
      background-color: black;
      border-radius: 50%;
      pointer-events: none;
    }

    .instruction .tap {
      display: none;
    }

    @media (hover: none) and (pointer: coarse) {
      .instruction .click {
        display: none;
      }

      .instruction .tap {
        display: inline;
      }
    }

    .instruction.hidden {
      opacity: 0;
    }
  </style>
</head>

<body>
  <main>
    <div class="title">
      <p>Artishock</p>
    </div>
    <div id="game" aria-live="polite">
    </div>
    <p class="instruction" id="instruction">
      <span class="click">Click to discover!</span>
      <span class="tap">Tap to discover!</span>
    </p>
    <div class="credits">
      <p>Olivia Benedetti<br>Nahele Belli<br>Daniele Falcone</p>
    </div>
  </main>

  <script>
    const game = document.querySelector("#game");
    const instruction = document.querySelector("#instruction");
    const svgUrl = "Punti_di_luce.svg";
    const animationVelocity = 200;

    fetch(svgUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Could not load the drawing (${response.status}).`);
        }
        return response.text();
      })
      .then(source => {
        const document = new DOMParser().parseFromString(source, "image/svg+xml");
        const svg = document.documentElement;
        if (document.querySelector("parsererror") || svg.localName !== "svg") {
          throw new Error("The SVG drawing could not be read.");
        }

        const circles = [...svg.querySelectorAll("circle")];
        const labels = [...svg.querySelectorAll("text")];
        const groups = new Map();

        for (const [index, label] of labels.entries()) {
          const match = label.textContent.trim().match(/^(\d+)([a-z])$/i);
          const dot = circles[index];
          if (!match || !dot) continue;

          const [, number, letter] = match;
          const key = letter.toUpperCase();
          const point = {
            number: Number(number),
            group: key,
            dot
          };
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(point);
        }

        const connections = document.createElementNS(svg.namespaceURI, "g");
        connections.setAttribute("aria-hidden", "true");
        svg.insertBefore(connections, svg.firstChild);

        const connect = (start, end) => {
          const line = document.createElementNS(svg.namespaceURI, "line");
          const x1 = Number(start.dot.getAttribute("cx"));
          const y1 = Number(start.dot.getAttribute("cy"));
          const x2 = Number(end.dot.getAttribute("cx"));
          const y2 = Number(end.dot.getAttribute("cy"));
          const length = Math.hypot(x2 - x1, y2 - y1);
          line.setAttribute("x1", x1);
          line.setAttribute("y1", y1);
          line.setAttribute("x2", x2);
          line.setAttribute("y2", y2);
          line.setAttribute("class", "connection");
          line.style.strokeDasharray = length;
          line.style.strokeDashoffset = length;
          line.style.setProperty("--draw-distance", length);
          line.style.setProperty("--draw-duration", `${length / animationVelocity * 1000}ms`);
          const finished = new Promise(resolve => {
            line.addEventListener("animationend", resolve, {
              once: true
            });
          });
          connections.append(line);
          return finished;
        };

        game.replaceChildren(svg);

        const orderedGroups = [...groups.entries()]
          .sort(([letterA], [letterB]) => letterA.localeCompare(letterB))
          .map(([, points]) => points);

        for (const points of orderedGroups) {
          points.sort((a, b) => a.number - b.number);
        }

        const shapes = document.createElementNS(svg.namespaceURI, "g");
        shapes.setAttribute("aria-hidden", "true");
        const shape = document.createElementNS(svg.namespaceURI, "path");
        shape.setAttribute("class", "shape");
        shape.setAttribute("fill-rule", "evenodd");
        shape.setAttribute("d", orderedGroups.map(points =>
          `M${points.map(({ dot }) =>
            `${dot.getAttribute("cx")},${dot.getAttribute("cy")}`).join(" L")}Z`).join(""));
        shapes.append(shape);
        svg.insertBefore(shapes, connections);

        let started = false;
        const startDrawing = async () => {
          if (started) return;
          started = true;
          instruction.classList.add("hidden");
          const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const shuffledGroups = [...orderedGroups];
          for (let index = shuffledGroups.length - 1; index > 0; index--) {
            const randomIndex = Math.floor(Math.random() * (index + 1));
            [shuffledGroups[index], shuffledGroups[randomIndex]] = [shuffledGroups[randomIndex], shuffledGroups[
              index]];
          }

          await Promise.all(shuffledGroups.map(async points => {
            const start = Math.floor(Math.random() * points.length);
            const direction = Math.random() < 0.5 ? 1 : -1;
            for (let index = 0; index < points.length; index++) {
              const
                current = (start + direction * index + points.length) % points.length;
              const next = (current + direction +
                points.length) % points.length;
              const finished = connect(points[current], points[next]);
              if (!reducedMotion) await
              finished;
            }
          }));
          await new Promise(resolve => setTimeout(resolve, 1000));
          svg.classList.add("shapes-filled");
        };
        svg.addEventListener("pointerdown", startDrawing);
        instruction.addEventListener("pointerdown", startDrawing);
      }).catch(error => {
        const message = document.querySelector("#message");
        message.textContent = error.message;
      });
  </script>
</body>

</html>
